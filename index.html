<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Management Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="loginView" class="view-container">
        <div class="auth-card">
            <header>
                <h1>Portal Login</h1>
                <p>Enter your 6-digit passcode.</p>
            </header>
            <div class="input-group">
                <input type="password" id="passcodeField" placeholder="••••••" maxlength="6">
                <button id="accessBtn">Authorize</button>
            </div>
            <div id="status" class="status-box"></div>
        </div>
    </main>

    <main id="dashboardView" class="view-container hidden">
        <div class="dashboard-wrapper">
            <header class="dash-nav">
                <div class="user-info">
                    <h2 id="displayUserName">User Name</h2>
                    <span id="displayUserRole" class="role-badge">Role</span>
                </div>
                <button id="logoutBtn" class="btn-logout">Session Logout</button>
            </header>
            
            <section id="moduleA" class="content-card hidden">
                <div class="card-header">
                    <h3>Module A: Personnel Setup</h3>
                    <p class="helper-text">All fields are mandatory. Passcodes are auto-generated.</p>
                </div>
                
                <div class="registration-form">
                    <input type="text" id="firstName" placeholder="First Name" required>
                    <input type="text" id="lastName" placeholder="Last Name" required>
                    <input type="email" id="userEmail" placeholder="Email" required>
                    <select id="userRole" required>
                        <option value="" disabled selected>Role</option>
                        <option value="SP">SP</option>
                        <option value="Educator">Educator</option>
                        <option value="COR">COR</option>
                        <option value="Administrator">Administrator</option>
                    </select>
                    <button id="createUserBtn">Register</button>
                </div>

                <div class="table-container">
                    <table class="user-table">
                        <thead>
                            <tr>
                                <th>Identity</th>
                                <th>Passcode</th>
                                <th>Permissions (B-F)</th>
                            </tr>
                        </thead>
                        <tbody id="userTableBody"></tbody>
                    </table>
                </div>
            </section>

            <div class="module-grid" id="moduleGrid"></div>
        </div>
    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
